aid: tamara-mellon
name: Tamara Mellon
description: >-
  Tamara Mellon Brand, Inc. is a Los Angeles based direct-to-consumer luxury footwear company founded
  in 2016 by designer Tamara Mellon, co-founder of Jimmy Choo, together with chief executive Jill
  Layfield. The brand sells Italian-made women's shoes and accessories straight to customers online
  rather than through wholesale, releasing product in monthly drops instead of following the
  traditional fashion calendar, and it is reported to have raised roughly $87 million in venture
  funding after the earlier Tamara Mellon LLC filed for Chapter 11 in 2015. In August 2025 the company
  announced a licensing and operating partnership with footwear licensing firm Titan Industries. It is
  a consumer goods retailer rather than a software company: it publishes no public API, developer
  portal, SDK, or machine-readable specification of any kind. As probed on 2026-08-29 its canonical
  domain returns HTTP 404 on every path from an unprovisioned CDN origin, and its Shopify storefront at
  shop.tamaramellon.com redirects to a store password gate.
